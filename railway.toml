[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node scripts/db-migrate.mjs && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Persistent volume for CMS-uploaded images and files
# Mount this in Railway dashboard: Settings → Volumes → /data
[[volumes]]
mountPath = "/data"

[environments.production.deploy]
numReplicas = 1
